name: Kiểm code theo video
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"        # thứ Hai hằng tuần: bắt sớm nếu môi trường đổi
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Kiểm kiểu cả repo (như Ngày 1 dạy)
        run: |
          if ls ngay-*/*.ts >/dev/null 2>&1; then npx tsc --noEmit; else echo 'Chưa có bài TypeScript'; fi
      - name: Chạy mọi file như học viên, so với README
        run: python tools/kiem.py
